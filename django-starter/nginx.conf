server {
    listen 80;
    server_name ai-to-business.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name ai-to-business.ru;

    ssl_certificate     /etc/letsencrypt/live/ai-to-business.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-to-business.ru/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}